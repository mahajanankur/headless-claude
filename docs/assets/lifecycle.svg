<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f849c"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="24" fill="#1e1e2e"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#cdd6f4">Job lifecycle and the retry ladder</text>
  <text x="48" y="86" font-size="16" fill="#a6adc8">Outcomes come from Claude's final result event, never the exit code. A job that acted is never blindly re-run.</text>

  <!-- main states -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="48" y="140" width="130" height="48" rx="24" fill="#313244"/>
    <text x="113" y="170" fill="#cdd6f4">queued</text>
    <rect x="226" y="140" width="130" height="48" rx="24" fill="#313244"/>
    <text x="291" y="170" fill="#cdd6f4">claimed</text>
    <rect x="404" y="140" width="150" height="48" rx="24" fill="#313244"/>
    <text x="479" y="170" fill="#cdd6f4">provisioning</text>
    <rect x="602" y="140" width="130" height="48" rx="24" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
    <text x="667" y="170" fill="#89b4fa">running</text>
  </g>
  <g stroke="#7f849c" stroke-width="2" marker-end="url(#a)">
    <line x1="180" y1="164" x2="222" y2="164"/>
    <line x1="358" y1="164" x2="400" y2="164"/>
    <line x1="556" y1="164" x2="598" y2="164"/>
  </g>

  <!-- side states -->
  <g font-size="14" text-anchor="middle">
    <rect x="48" y="232" width="150" height="40" rx="20" fill="none" stroke="#f9e2af" stroke-dasharray="5 4"/>
    <text x="123" y="257" fill="#f9e2af">waiting_limit</text>
    <text x="123" y="296" fill="#7f849c" font-size="13">plan limit hit · resumes at reset</text>
    <path d="M113,230 V192" stroke="#f9e2af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  </g>

  <!-- terminal states -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="840" y="112" width="170" height="40" rx="20" fill="#a6e3a1"/>
    <text x="925" y="138" fill="#11111b">succeeded</text>
    <rect x="840" y="164" width="170" height="40" rx="20" fill="#f38ba8"/>
    <text x="925" y="190" fill="#11111b">failed</text>
    <rect x="840" y="216" width="170" height="40" rx="20" fill="#fab387"/>
    <text x="925" y="242" fill="#11111b">timed_out</text>
    <rect x="840" y="268" width="170" height="40" rx="20" fill="#f9e2af"/>
    <text x="925" y="294" fill="#11111b">needs_review</text>
    <rect x="840" y="320" width="170" height="40" rx="20" fill="#9399b2"/>
    <text x="925" y="346" fill="#11111b">cancelled</text>
  </g>
  <g stroke="#7f849c" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M734,164 C780,164 790,132 836,132"/>
    <path d="M734,164 L836,184"/>
    <path d="M734,164 C780,170 790,236 836,236"/>
    <path d="M734,164 C770,180 780,288 836,288"/>
    <path d="M734,164 C760,190 770,340 836,340"/>
  </g>
  <text x="1030" y="138" font-size="13" fill="#a6adc8">validated output</text>
  <text x="1030" y="190" font-size="13" fill="#a6adc8">certainly changed nothing</text>
  <text x="1030" y="242" font-size="13" fill="#a6adc8">kill ladder: INT → TERM → KILL</text>
  <text x="1030" y="294" font-size="13" fill="#a6adc8">acted, then broke</text>
  <text x="1030" y="346" font-size="13" fill="#a6adc8">via control file</text>

  <!-- retry ladder -->
  <g transform="translate(236,250)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#cba6f7">After a crash, the worker climbs the ladder:</text>
    <g font-size="14">
      <rect x="0" y="16" width="150" height="58" rx="12" fill="#181825" stroke="#cba6f7"/>
      <text x="75" y="40" text-anchor="middle" font-weight="700" fill="#cdd6f4">1 · resume</text>
      <text x="75" y="60" text-anchor="middle" fill="#a6adc8">same Claude session</text>
      <rect x="176" y="16" width="150" height="58" rx="12" fill="#181825" stroke="#cba6f7"/>
      <text x="251" y="40" text-anchor="middle" font-weight="700" fill="#cdd6f4">2 · fresh</text>
      <text x="251" y="60" text-anchor="middle" fill="#a6adc8">only if nothing acted</text>
      <rect x="352" y="16" width="150" height="58" rx="12" fill="#181825" stroke="#f9e2af"/>
      <text x="427" y="40" text-anchor="middle" font-weight="700" fill="#f9e2af">3 · needs_review</text>
      <text x="427" y="60" text-anchor="middle" fill="#a6adc8">a human decides</text>
    </g>
    <g stroke="#7f849c" stroke-width="2" marker-end="url(#a)">
      <line x1="152" y1="45" x2="172" y2="45"/>
      <line x1="328" y1="45" x2="348" y2="45"/>
    </g>
  </g>

  <text x="640" y="412" text-anchor="middle" font-size="14" fill="#7f849c">Every transition is guarded in one transaction with its status event · terminal states are immutable</text>
</svg>
