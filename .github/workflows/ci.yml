name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cc_gateway
          POSTGRES_PASSWORD: cc_gateway
          POSTGRES_DB: cc_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cc_gateway"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cc_gateway:cc_gateway@127.0.0.1:5432/cc_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run db:migrate:test
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
