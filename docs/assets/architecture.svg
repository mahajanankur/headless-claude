<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f849c"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6e3a1"/>
    </marker>
  </defs>
  <rect width="1280" height="500" rx="24" fill="#1e1e2e"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#cdd6f4">How a job flows</text>
  <text x="48" y="86" font-size="16" fill="#a6adc8">Two processes from one image. Postgres is the only queue and signal bus.</text>

  <!-- clients -->
  <g>
    <rect x="48" y="150" width="190" height="170" rx="16" fill="#181825" stroke="#45475a"/>
    <text x="143" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#cdd6f4">Your services</text>
    <text x="143" y="220" text-anchor="middle" font-size="15" fill="#a6adc8">backend apps</text>
    <text x="143" y="244" text-anchor="middle" font-size="15" fill="#a6adc8">cron / CI</text>
    <text x="143" y="268" text-anchor="middle" font-size="15" fill="#a6adc8">browsers (stream token)</text>
    <text x="143" y="300" text-anchor="middle" font-size="13" fill="#7f849c">API key per app</text>
  </g>

  <!-- API -->
  <g>
    <rect x="310" y="150" width="190" height="170" rx="16" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
    <text x="405" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#89b4fa">API</text>
    <text x="405" y="220" text-anchor="middle" font-size="15" fill="#cdd6f4">/jobs · /chat</text>
    <text x="405" y="244" text-anchor="middle" font-size="15" fill="#cdd6f4">validate · budget</text>
    <text x="405" y="268" text-anchor="middle" font-size="15" fill="#cdd6f4">SSE · Socket.IO</text>
    <text x="405" y="300" text-anchor="middle" font-size="13" fill="#7f849c">Express 5</text>
  </g>

  <!-- Postgres -->
  <g>
    <ellipse cx="660" cy="166" rx="92" ry="18" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <path d="M568,166 v138 a92,18 0 0 0 184,0 v-138" fill="#181825" stroke="#f9e2af" stroke-width="2"/>
    <ellipse cx="660" cy="166" rx="92" ry="18" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <text x="660" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#f9e2af">Postgres</text>
    <text x="660" y="240" text-anchor="middle" font-size="15" fill="#cdd6f4">jobs · events</text>
    <text x="660" y="264" text-anchor="middle" font-size="15" fill="#cdd6f4">SKIP LOCKED</text>
    <text x="660" y="288" text-anchor="middle" font-size="15" fill="#cdd6f4">LISTEN/NOTIFY</text>
  </g>

  <!-- Worker -->
  <g>
    <rect x="820" y="150" width="170" height="170" rx="16" fill="#181825" stroke="#cba6f7" stroke-width="2"/>
    <text x="905" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#cba6f7">Worker</text>
    <text x="905" y="220" text-anchor="middle" font-size="15" fill="#cdd6f4">schedule · claim</text>
    <text x="905" y="244" text-anchor="middle" font-size="15" fill="#cdd6f4">classify · retry</text>
    <text x="905" y="268" text-anchor="middle" font-size="15" fill="#cdd6f4">deliver · webhooks</text>
    <text x="905" y="300" text-anchor="middle" font-size="13" fill="#7f849c">re-attaches on restart</text>
  </g>

  <!-- Sandbox -->
  <g>
    <rect x="1052" y="130" width="190" height="210" rx="16" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1147" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#a6e3a1" letter-spacing="2">SANDBOX</text>
    <rect x="1070" y="172" width="154" height="56" rx="12" fill="#181825" stroke="#45475a"/>
    <text x="1147" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#cdd6f4">ccwrap</text>
    <text x="1147" y="217" text-anchor="middle" font-size="12" fill="#a6adc8">stream · exit · cancel</text>
    <rect x="1070" y="246" width="154" height="74" rx="12" fill="#181825" stroke="#fab387"/>
    <text x="1147" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#fab387">claude -p</text>
    <text x="1147" y="294" text-anchor="middle" font-size="12" fill="#a6adc8">skill · allow-listed tools</text>
    <text x="1147" y="310" text-anchor="middle" font-size="12" fill="#a6adc8">docker | host | local</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#7f849c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="210" x2="306" y2="210"/>
    <line x1="502" y1="210" x2="564" y2="210"/>
    <line x1="754" y1="210" x2="816" y2="210"/>
    <line x1="992" y1="210" x2="1048" y2="210"/>
  </g>
  <g font-size="13" fill="#7f849c" text-anchor="middle">
    <text x="273" y="200">POST</text>
    <text x="533" y="200">queued</text>
    <text x="785" y="200">NOTIFY</text>
    <text x="1020" y="200">spawn</text>
  </g>

  <!-- return path -->
  <path d="M1147,342 v70 H143 v-88" stroke="#a6e3a1" stroke-width="2" fill="none" stroke-dasharray="2 0" marker-end="url(#arrowG)"/>
  <rect x="380" y="396" width="520" height="34" rx="17" fill="#1e1e2e"/>
  <text x="640" y="419" text-anchor="middle" font-size="16" fill="#a6e3a1">stream.jsonl → job_events → SSE / Socket.IO / signed webhooks</text>

  <text x="640" y="470" text-anchor="middle" font-size="14" fill="#7f849c">Results are validated against the skill's JSON schema · patches, branches and PRs are delivered by the gateway, never by Claude</text>
</svg>
